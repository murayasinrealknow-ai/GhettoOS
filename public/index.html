<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhettoOS</title>
  <link rel="icon" id="favicon" href="data:,">
  <script src="/winbox/winbox.bundle.min.js"></script>
  <style>
    /* ===================== GhettoOS — dark "liquid glass" theme =====================
       Glass = translucent fill + one backdrop blur (14px) + a 1px inner highlight.
       Blur is only used on the menu bar, dock, windows and lock card, never stacked
       on big animated layers, so it stays smooth on Chromebooks. */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ink: #ecebf2;
      --muted: #9b9aa8;
      --line: rgba(255, 255, 255, .10);
      --hi: rgba(255, 255, 255, .14);
      --glass: rgba(20, 20, 28, .72);
      --glass-bar: rgba(16, 16, 24, .55);
      --blur: blur(14px) saturate(150%);
      --accent: #e0b866;            /* antique gold, from the clock logo and the engraving */
      --accent-soft: rgba(224, 184, 102, .22);
      --menu-h: 30px;
      --dock-icon: 52px;
      --wall: radial-gradient(ellipse 60% 50% at 18% 22%, rgba(92, 64, 170, .55), transparent 70%),
              radial-gradient(ellipse 50% 45% at 82% 28%, rgba(28, 92, 168, .45), transparent 70%),
              radial-gradient(ellipse 70% 50% at 62% 88%, rgba(176, 116, 48, .30), transparent 70%),
              radial-gradient(ellipse 40% 32% at 36% 70%, rgba(128, 40, 116, .35), transparent 70%),
              #07070d;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--wall); -webkit-font-smoothing: antialiased; }
    body.compact { --dock-icon: 40px; }
    button, input, select, textarea { font-family: var(--font); }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :root { --glass: rgba(22, 22, 30, .96); --glass-bar: rgba(18, 18, 26, .95); }
    }

    /* ---- Wallpaper layers ---- */
    #bg { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
    #bg.dust::before { content: ""; position: absolute; inset: 0; opacity: .55; background-size: 340px 340px;
      background-image: radial-gradient(1px 1px at 30px 40px, #fff, transparent), radial-gradient(1px 1px at 140px 90px, #d9d2ff, transparent), radial-gradient(1.4px 1.4px at 230px 170px, #fff, transparent), radial-gradient(1px 1px at 80px 250px, #ffe7c2, transparent), radial-gradient(1px 1px at 300px 300px, #fff, transparent); }
    #accent { position: fixed; right: 3vw; top: 50%; width: min(42vw, 540px); transform: translateY(-52%); opacity: .085; pointer-events: none; z-index: -1; user-select: none; }
    .bg-aurora { background: linear-gradient(120deg, #120f2e, #3b2f8f, #0d4f6b, #5b2380, #8a1f55, #120f2e); background-size: 400% 400%; animation: bg-shift 30s ease-in-out infinite; }
    @keyframes bg-shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .bg-stars { background: #04050c; }
    .bg-stars::before, .bg-stars::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; top: -300px; background-size: 300px 300px; animation: star-fall 40s linear infinite;
      background-image: radial-gradient(1.6px 1.6px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 120px 80px, #cde, transparent), radial-gradient(1.4px 1.4px at 210px 150px, #fff, transparent), radial-gradient(1px 1px at 60px 210px, #fff, transparent), radial-gradient(1.2px 1.2px at 260px 260px, #ddf, transparent); }
    .bg-stars::after { top: -470px; background-size: 470px 470px; opacity: .55; animation-name: star-fall-far; animation-duration: 90s; }
    @keyframes star-fall { to { transform: translateY(300px); } }
    @keyframes star-fall-far { to { transform: translateY(470px); } }
    .bg-lava { background: #0a0b14; }
    .bg-lava::before, .bg-lava::after { content: ""; position: absolute; width: 75vmax; height: 75vmax; border-radius: 50%; }
    .bg-lava::before { left: -20vmax; top: -20vmax; background: radial-gradient(circle, rgba(170, 70, 200, .5), transparent 62%); animation: drift-a 26s ease-in-out infinite alternate; }
    .bg-lava::after { right: -25vmax; bottom: -25vmax; background: radial-gradient(circle, rgba(224, 160, 70, .4), transparent 62%); animation: drift-b 32s ease-in-out infinite alternate; }
    @keyframes drift-a { to { transform: translate(40vw, 30vh) scale(1.2); } }
    @keyframes drift-b { to { transform: translate(-35vw, -25vh) scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { #bg, #bg::before, #bg::after { animation: none !important; } }

    /* ---- Menu bar ---- */
    #menubar { position: fixed; top: 0; left: 0; right: 0; height: var(--menu-h); z-index: 100000; display: flex; align-items: center; gap: 6px; padding: 0 10px;
      background: var(--glass-bar); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: 13px; user-select: none; }
    .mb-btn { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; cursor: default; }
    .mb-btn:hover, .mb-btn[aria-expanded="true"] { background: rgba(255, 255, 255, .13); }
    .mb-logo img { width: 20px; height: 20px; border-radius: 50%; display: block; object-fit: cover; background: #0d0c14; }
    #mb-app { font-weight: 700; padding: 0 6px; }
    .mb-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .mb-right span { padding: 0 6px; white-space: nowrap; }
    #mb-menu { position: fixed; top: calc(var(--menu-h) + 4px); left: 8px; z-index: 100001; min-width: 230px; padding: 5px; border-radius: 10px;
      background: rgba(28, 28, 38, .78); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 16px 40px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--hi); }
    #mb-menu[hidden] { display: none; }
    #mb-menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 5px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: default; }
    #mb-menu button:hover { background: var(--accent-soft); }
    #mb-menu kbd { font: inherit; color: var(--muted); }
    #mb-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 6px; }

    /* ---- Dock ---- */
    #dock { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 100000; height: calc(var(--dock-icon) + 14px); box-sizing: border-box;
      display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px; border-radius: 22px;
      background: rgba(30, 30, 42, .45); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .45), inset 0 0 0 1px var(--hi), inset 0 1px 0 rgba(255, 255, 255, .10); }
    .dock-item { position: relative; flex: none; width: var(--dock-icon); height: var(--dock-icon); padding: 0; border: 0; background: none; cursor: pointer; transition: width .16s ease-out, height .16s ease-out; }
    #dock.magnify .dock-item { transition-duration: .06s; }
    .dock-item .tile { position: absolute; inset: 0; border-radius: 23%; overflow: hidden; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .12); }
    /* Clear glass tiles: the wallpaper (whatever theme is picked) shows through. */
    .tile { background: linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04)); }
    .tile.native { color: #f0dfb6; }
    .tile.native svg { width: 54%; height: 54%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tile.sphere img { width: 88%; height: 88%; object-fit: contain; }
    .tile.site img { width: 58%; height: 58%; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }

    /* ---- Desktop icons ---- */
    #desktop { position: fixed; top: calc(var(--menu-h) + 14px); left: 14px; bottom: calc(var(--dock-icon) + 40px); z-index: 0;
      display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 88px; gap: 4px; align-content: start; }
    .desk-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px 6px; border: 0; border-radius: 10px; background: none; color: #fff; cursor: pointer; font: 500 12px/1.2 var(--font); }
    .desk-item:hover, .desk-item:focus-visible { background: rgba(255, 255, 255, .10); outline: none; }
    .desk-item:focus-visible .tile { box-shadow: 0 0 0 2px var(--accent); }
    .desk-item .tile { position: relative; width: 54px; height: 54px; flex: none; border-radius: 23%; overflow: hidden; display: grid; place-items: center;
      -webkit-backdrop-filter: blur(10px) saturate(140%); backdrop-filter: blur(10px) saturate(140%); box-shadow: 0 3px 8px rgba(0, 0, 0, .4), inset 0 0 0 1px rgba(255, 255, 255, .14); }
    .desk-item .tile .letter { font-size: 24px; }
    .desk-item .label { max-width: 100%; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile .letter { width: 100%; height: 100%; font-size: calc(var(--dock-icon) * .45); }
    .dock-item::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255, 255, 255, .9); opacity: 0; transition: opacity .2s; }
    .dock-item.running::after { opacity: 1; }
    .dock-item .tip { position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%); padding: 4px 10px; border-radius: 7px; white-space: nowrap; font-size: 12px; color: var(--ink);
      background: rgba(28, 28, 38, .85); box-shadow: inset 0 0 0 1px var(--hi); opacity: 0; pointer-events: none; transition: opacity .12s; }
    .dock-item:hover .tip, .dock-item:focus-visible .tip { opacity: 1; }
    .dock-item:focus-visible { outline: none; }
    .dock-item:focus-visible .tile { box-shadow: 0 0 0 2px var(--accent); }
    .dock-sep { width: 1px; align-self: stretch; margin: 2px 3px; background: rgba(255, 255, 255, .18); }
    @media (max-width: 720px) { :root { --dock-icon: 38px; } #dock { gap: 4px; padding: 6px; } }

    /* ---- Glass windows (WinBox) ---- */
    body .winbox { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-radius: 12px; color: var(--ink);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(0, 0, 0, .55); animation: win-in .18s ease-out; }
    body .winbox::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .10); }
    @keyframes win-in { from { opacity: 0; transform: scale(.97); } }
    body .winbox.min { display: none; }             /* minimized windows live in the dock */
    body .winbox .wb-header { height: 38px; line-height: 38px; color: var(--ink); }
    body .winbox .wb-body { top: 38px; background: transparent; border-radius: 0 0 12px 12px; overflow: hidden !important; }
    body .winbox .wb-drag { padding-left: 0; }
    body .winbox .wb-title { font: 600 13px/38px var(--font); text-align: center; padding: 0 84px; color: rgba(236, 235, 242, .92); }
    body .winbox:not(.focus) .wb-title { color: rgba(236, 235, 242, .5); }
    body .winbox .wb-icon { display: none !important; }
    body .winbox .wb-control { position: absolute; left: 14px; top: 0; z-index: 2; float: none; height: 100%; display: flex; align-items: center; gap: 8px; }
    body .winbox .wb-control span { position: relative; flex: none; width: 12px; height: 12px; border-radius: 50%; background-image: none; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
    body .winbox .wb-close { order: 0; background-color: #ff5f57; }
    body .winbox .wb-min { order: 1; background-color: #febc2e; }
    body .winbox .wb-max { order: 2; background-color: #28c840; }
    body .winbox .wb-full { display: none; }
    body .winbox:not(.focus) .wb-control span { background-color: rgba(255, 255, 255, .2); }
    body .winbox .wb-control:hover span.wb-close { background-color: #ff5f57; }
    body .winbox .wb-control:hover span.wb-min { background-color: #febc2e; }
    body .winbox .wb-control:hover span.wb-max { background-color: #28c840; }
    body .winbox .wb-control span::before { position: absolute; inset: 0; font: 700 10px/12px var(--font); text-align: center; color: rgba(0, 0, 0, .6); opacity: 0; }
    body .winbox .wb-control:hover span::before { opacity: 1; }
    body .winbox .wb-close::before { content: "\00d7"; }
    body .winbox .wb-min::before { content: "\2212"; }
    body .winbox .wb-max::before { content: "+"; }

    /* ---- App contents ---- */
    .app { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: transparent; color: var(--ink); }
    .app .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex: none; border-bottom: 1px solid rgba(255, 255, 255, .06); }
    .app .bar input, .app .bar select { flex: 1; min-width: 0; height: 30px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, .07); color: var(--ink); font: 13px var(--font); outline: none; }
    .app .bar select { flex: none; width: auto; padding-right: 8px; }
    .app .bar option { background: #1c1b26; }
    .app .bar input:focus { border-color: rgba(224, 184, 102, .6); background: rgba(255, 255, 255, .1); }
    .app .bar button { flex: none; height: 30px; min-width: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px;
      background: transparent; color: var(--ink); font: 600 13px var(--font); cursor: pointer; }
    .app .bar button:hover { background: rgba(255, 255, 255, .1); }
    .app .bar .go { background: rgba(255, 255, 255, .1); padding: 0 14px; border-radius: 999px; }
    /* WinBox's stylesheet makes every iframe in a window position:absolute and 100% tall,
       which put the iframe on top of the address bar. Keep ours in the flex layout. */
    .winbox .app iframe { position: static; flex: 1; width: 100%; height: auto; min-height: 0; border: 0; background: #fff; }
    .app .status { padding: 8px 14px 2px; flex: none; color: var(--muted); font-size: 12px; }
    .site-app .app-title { flex: 1; padding: 0 6px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }

    /* Games */
    .grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 10px 14px 14px; align-content: start; }
    .grid button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .07);
      background: rgba(255, 255, 255, .05); color: var(--ink); font: 12.5px var(--font); cursor: pointer; transition: background .12s, transform .12s; }
    .grid button:hover { background: rgba(255, 255, 255, .1); transform: translateY(-1px); }
    .grid button[hidden] { display: none; }
    .grid img, .letter { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    .letter { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 44px; font-weight: 700; }
    .grid span { overflow-wrap: anywhere; text-align: center; line-height: 1.25; }
    .grid small { color: var(--muted); font-size: 11px; }
    .picker, .player { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .picker[hidden], .player[hidden] { display: none; }
    .player .game-title { flex: 1; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; }
    .player .game-msg { color: var(--muted); font-size: 12px; }
    .player .bar button { font-size: 15px; }

    /* ---- Cover when unfocused ---- */
    #cover { position: fixed; inset: 0; z-index: 2147483000; background: #fff; display: flex; }
    #cover[hidden] { display: none; }
    #cover iframe { flex: 1; width: 100%; height: 100%; border: 0; }

    /* ---- Lock screen ---- */
    #lock { position: fixed; inset: 0; z-index: 2147482500; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 8vh 16px 4vh; box-sizing: border-box; color: #fff; background: var(--wall); transition: opacity .45s ease, transform .45s ease; }
    #lock[hidden] { display: none; }
    #lock.unlocking { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #lock video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    #lock::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .45)), linear-gradient(transparent 55%, rgba(0, 0, 0, .35)); }
    .lock-top { text-align: center; text-shadow: 0 2px 20px rgba(0, 0, 0, .45); }
    .lock-date { font-size: 19px; font-weight: 600; opacity: .9; }
    .lock-time { font-size: clamp(64px, 12vw, 128px); font-weight: 600; line-height: 1; letter-spacing: -.03em; margin-top: 4px; background: linear-gradient(#fff, rgba(255, 255, 255, .78)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lock-card { width: min(340px, 100%); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 26px 24px 20px; border-radius: 28px;
      background: rgba(20, 20, 28, .42); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .14), inset 0 1px 0 rgba(255, 255, 255, .14); }
    .lock-logo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: radial-gradient(circle at 50% 40%, #2a2440, #0d0c16 75%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .2), 0 12px 30px rgba(0, 0, 0, .55), 0 0 46px rgba(224, 184, 102, .22); }
    .lock-name { font-size: 22px; font-weight: 600; letter-spacing: .01em; margin-bottom: 4px; }
    .pill-wrap { position: relative; width: 100%; }
    .pill { width: 100%; height: 40px; box-sizing: border-box; padding: 0 44px 0 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .10); color: #fff; font: 14px var(--font); outline: none; transition: border-color .15s, background .15s; }
    .pill::placeholder { color: rgba(255, 255, 255, .55); }
    .pill:focus { border-color: rgba(224, 184, 102, .75); background: rgba(255, 255, 255, .14); }
    .pill-go { position: absolute; right: 5px; top: 5px; width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
      background: rgba(255, 255, 255, .18); color: #fff; transition: background .15s; }
    .pill-go:hover { background: var(--accent); color: #1a1408; }
    /* Show / hide password eye */
    .pass-eye { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center;
      background: none; color: rgba(255, 255, 255, .6); cursor: pointer; }
    .pass-eye:hover, .pass-eye[aria-pressed="true"] { color: #fff; background: rgba(255, 255, 255, .1); }
    .pass-eye svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .pill-wrap .pass-eye { right: 40px; }
    #lock-pass { padding-right: 74px; }
    .eye-wrap { position: relative; width: 100%; }
    .eye-wrap .pass-eye { right: 5px; }
    .eye-wrap input { padding-right: 40px !important; }
    .lock-msg { min-height: 16px; font-size: 12.5px; color: rgba(255, 255, 255, .62); text-align: center; }
    .lock-msg.err { color: #ff9b95; }
    .lock-links { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(255, 255, 255, .4); }
    .lock-links button { border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: rgba(255, 255, 255, .72); font: inherit; cursor: pointer; }
    .lock-links button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
    .lock-card.busy, .auth-box.busy { opacity: .7; pointer-events: none; }
    .lock-foot { min-height: 28px; display: flex; align-items: center; justify-content: center; text-align: center; }
    .tagline { font-size: 15px; font-style: italic; letter-spacing: .02em; color: rgba(240, 223, 182, .78); text-shadow: 0 2px 12px rgba(0, 0, 0, .6); transition: opacity .5s ease, transform .5s ease; }
    .tagline.out { opacity: 0; transform: translateY(6px); }

    /* ---- Chat app ---- */
    .chat-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, .06); flex: none; }
    .chat-top b { font-size: 14px; }
    .chat-top.ai-key[hidden] { display: none; }
    .chat-top .online { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .chat-top .online::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34c759; }
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
    .chat-msg { display: flex; gap: 10px; padding: 4px 6px; border-radius: 8px; }
    .chat-msg:hover { background: rgba(255, 255, 255, .03); }
    .chat-msg.cont { padding-top: 0; }
    .chat-msg.cont .avatar { visibility: hidden; height: 0; }
    .chat-msg .avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
    .chat-msg .body { min-width: 0; flex: 1; }
    .chat-msg .who { display: flex; align-items: baseline; gap: 8px; }
    .chat-msg .who b { font-size: 13px; }
    .chat-msg .who time { font-size: 11px; color: var(--muted); }
    .chat-msg .text { white-space: pre-wrap; overflow-wrap: anywhere; color: #dcdbe4; }
    .chat-msg.mine .who b { color: var(--accent); }
    .chat-empty { margin: auto; color: var(--muted); text-align: center; }
    .chat-send { display: flex; gap: 8px; padding: 10px 14px 12px; flex: none; border-top: 1px solid rgba(255, 255, 255, .06); }
    .chat-send input { flex: 1; min-width: 0; height: 36px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); font: 13.5px var(--font); outline: none; }

    .chat-send button, .auth-box .primary { height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--accent); color: #1a1408; font: 600 13px var(--font); cursor: pointer; }

    .chat-msg { position: relative; }

    .chat-msg .acts { position: absolute; right: 6px; top: -12px; z-index: 1; display: none; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(32, 32, 44, .96); box-shadow: inset 0 0 0 1px var(--hi), 0 4px 12px rgba(0, 0, 0, .4); }

    .chat-msg .acts button { width: 28px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--ink); cursor: pointer; font-size: 14px; display: grid; place-items: center; }
    .chat-msg .acts button:hover { background: rgba(255, 255, 255, .12); }
    .chat-msg .quote { display: block; max-width: 100%; margin: 2px 0; padding: 0 0 0 8px; border: 0; border-left: 2px solid rgba(224, 184, 102, .55); background: none; color: var(--muted); font: 12px var(--font); text-align: left; cursor: pointer;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .reacts:empty { display: none; }
    .reacts button { height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink); font: 12px var(--font); cursor: pointer; }
    .reacts button.on { border-color: rgba(224, 184, 102, .7); background: var(--accent-soft); }
    .chat-reply { display: flex; align-items: center; gap: 8px; padding: 7px 16px 0; font-size: 12px; color: var(--muted); flex: none; }

    .chat-reply span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-reply b { color: var(--accent); }

    .chat-send button.emoji-btn { width: 36px; flex: none; padding: 0; background: rgba(255, 255, 255, .08); font-size: 17px; }
    .av { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
    .av.sm { width: 24px; height: 24px; font-size: 11px; }

    /* ---- Pop-up menus (right-click / ⋯) and emoji picker ---- */
    .ctx-menu { position: fixed; z-index: 200000; min-width: 190px; padding: 5px; border-radius: 10px; font-size: 13px;
      background: rgba(28, 28, 38, .92); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 16px 40px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--hi); }
    .ctx-menu .item { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .ctx-menu .item:hover:not(:disabled) { background: var(--accent-soft); }
    .ctx-menu .item:disabled { color: var(--muted); cursor: default; }
    .ctx-menu .item.danger { color: #ff9b95; }
    .ctx-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 6px; }
    .ctx-menu .emojis { display: flex; flex-wrap: wrap; gap: 2px; }
    .ctx-menu .emojis.grid { display: grid; grid-template-columns: repeat(8, 34px); }
    .ctx-menu .emojis button { width: 34px; height: 34px; border: 0; border-radius: 8px; background: none; font-size: 19px; cursor: pointer; }
    .ctx-menu .emojis button:hover { background: rgba(255, 255, 255, .12); }

    .toast { position: fixed; left: 50%; bottom: calc(var(--dock-icon) + 36px); transform: translateX(-50%); z-index: 200001; max-width: min(420px, 90vw); padding: 9px 16px; border-radius: 12px; font-size: 13px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none;
      background: rgba(28, 28, 38, .92); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 0 0 1px var(--hi); }

    /* ---- Shared small controls ---- */
    .gbtn { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); font: 600 12.5px var(--font); cursor: pointer; white-space: nowrap; }
    .gbtn:hover:not(:disabled) { background: rgba(255, 255, 255, .13); }
    .gbtn.primary { background: var(--accent); color: #1a1408; border-color: transparent; }
    .gbtn.primary:hover:not(:disabled) { background: #ebc77c; }
    .gbtn.danger { color: #ff9b95; }
    .gbtn:disabled { opacity: .5; cursor: default; }
    .ginput { height: 30px; min-width: 0; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); font: 13px var(--font); outline: none; }
    .ginput:focus, .suggest textarea:focus { border-color: rgba(224, 184, 102, .6); }
    .seg { display: flex; gap: 6px; }
    .seg button { height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ink); font: 600 12.5px var(--font); cursor: pointer; }
    .seg button.on { background: var(--accent); color: #1a1408; border-color: transparent; }
    .badge { min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #ff453a; color: #fff; font: 700 11px/18px var(--font); text-align: center; }
    .desk-item { position: relative; }
    .desk-item .badge { position: absolute; top: 2px; right: 12px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .35); }

    /* ---- Inbox ---- */
    .inbox { flex-direction: row; }
    .inbox-side { width: 220px; flex: none; box-sizing: border-box; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid rgba(255, 255, 255, .06); }
    .inbox-side h4 { margin: 12px 6px 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .inbox-side .none { padding: 2px 6px; font-size: 12px; color: var(--muted); }
    .inbox-add { display: flex; gap: 6px; }
    .inbox-add .ginput { flex: 1; }
    .inbox-msg { min-height: 15px; padding: 2px 6px; font-size: 12px; color: var(--muted); }
    .inbox-msg.err { color: #ff9b95; }
    .person { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 6px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: 13px var(--font); text-align: left; }
    button.person { cursor: pointer; }
    button.person:hover, .person.sel { background: rgba(255, 255, 255, .08); }
    .person .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .person .mini { flex: none; height: 22px; padding: 0 8px; border: 0; border-radius: 6px; background: rgba(255, 255, 255, .1); color: var(--ink); font: 600 11px var(--font); cursor: pointer; }
    .person .mini:hover { background: rgba(255, 255, 255, .18); }
    .person .mini.ok { background: var(--accent); color: #1a1408; }
    .inbox-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .inbox-empty { margin: auto; padding: 20px; color: var(--muted); text-align: center; font-size: 13px; }
    @media (max-width: 560px) { .inbox-side { width: 160px; } }

    /* ---- Leaderboard ---- */
    .lb-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; flex: none; }
    .lb-head .gbtn { margin-left: auto; }
    .lb-me { display: flex; gap: 22px; margin: 2px 16px 8px; padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, .06); font-size: 12px; color: var(--muted); flex: none; }
    .lb-me b { display: block; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .lb-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 12px 14px; list-style: none; }
    .lb-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; font-size: 13.5px; }
    .lb-list li.me { background: var(--accent-soft); }
    .lb-list .rank { width: 30px; flex: none; text-align: center; font-weight: 700; color: var(--muted); }
    .lb-list .rank.medal { font-size: 18px; }
    .lb-list .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .lb-list .val { font-variant-numeric: tabular-nums; color: #f0dfb6; white-space: nowrap; }
    .lb-list .sub { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
    .lb-note { padding: 18px; color: var(--muted); text-align: center; font-size: 13px; }

    /* ---- Calculator ---- */
    .calc { padding: 12px 14px 14px; gap: 8px; user-select: none; outline: none; }
    .calc-expr { min-height: 18px; padding: 0 6px; text-align: right; font-size: 13px; color: var(--muted); }
    .calc-display { padding: 0 6px 4px; text-align: right; font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 8px; }
    .calc-keys button { border: 0; border-radius: 16px; background: rgba(255, 255, 255, .10); color: var(--ink); font: 500 20px var(--font); cursor: pointer; }
    .calc-keys button:hover { background: rgba(255, 255, 255, .17); }

    /* ---- Notepad ---- */
    .notes { flex-direction: row; }
    .notes-side { width: 200px; flex: none; display: flex; flex-direction: column; border-right: 1px solid rgba(255, 255, 255, .06); }
    .notes-side .notes-bar { display: flex; gap: 6px; padding: 10px; }

    .notes-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .note-item { display: block; width: 100%; padding: 7px 9px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .note-item:hover { background: rgba(255, 255, 255, .06); }
    .note-item.sel { background: var(--accent-soft); }
    .note-item b { display: block; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .note-item small { font-size: 11px; color: var(--muted); }
    .notes textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font: 14px/1.6 var(--font); padding: 14px 18px; }
    @media (max-width: 560px) { .notes-side { width: 140px; } }

    /* ---- Changelog ---- */
    .changelog { display: block; overflow-y: auto; padding: 18px 24px 24px; }
    .cl-rel { margin-bottom: 26px; }
    .cl-rel header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
    .cl-rel .ver { font-size: 22px; font-weight: 700; color: var(--accent); }
    .cl-rel .ttl { font-size: 15px; font-weight: 600; }
    .cl-rel .date { font-size: 12px; color: var(--muted); }
    .cl-rel h4 { margin: 14px 0 4px; font-size: 13px; }
    .cl-rel ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #d4d2de; }

    /* ---- Suggestions ---- */
    .suggest { overflow-y: auto; padding: 18px 20px; gap: 10px; }
    .suggest h2 { margin: 0; font-size: 18px; }
    .suggest h3 { margin: 14px 0 0; font-size: 14px; }
    .suggest p { margin: 0; font-size: 13px; color: var(--muted); }
    .suggest textarea { flex: none; min-height: 140px; resize: vertical; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); font: 14px/1.5 var(--font); outline: none; }
    .suggest .row { display: flex; align-items: center; gap: 10px; }
    .suggest .note { font-size: 12.5px; color: var(--muted); }
    .suggest .note.err { color: #ff9b95; }
    .sg-item { flex: none; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
    .sg-item .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .sg-item .meta .gbtn { margin-left: auto; height: 24px; padding: 0 9px; font-size: 11.5px; }
    .sg-item .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
    .auth-box { margin: auto; width: min(320px, 90%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .auth-box .logo-img { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2a2440, #0d0c16 75%); }
    .auth-box h2 { margin: 4px 0 0; font-size: 18px; }
    .auth-box p { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
    .auth-box input { width: 100%; height: 38px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); font: 13.5px var(--font); outline: none; }
    .auth-box input:focus { border-color: rgba(224, 184, 102, .6); }
    .auth-box .row2 { display: flex; gap: 8px; width: 100%; }
    .auth-box .row2 button { flex: 1; }
    .auth-box .secondary { height: 36px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .07); color: var(--ink); font: 600 13px var(--font); cursor: pointer; }
    .auth-box .msg { min-height: 16px; font-size: 12.5px; color: #ff9b95; }

    /* ---- Games: favorites ---- */
    .grid .tile-wrap { position: relative; display: flex; }
    .grid .tile-wrap[hidden] { display: none; }
    .grid .tile-wrap > button.game { flex: 1; min-width: 0; }
    .grid .fav { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 0; display: grid; place-items: center;
      background: rgba(10, 10, 16, .6); color: rgba(255, 255, 255, .85); font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s; transform: none; }
    .grid .tile-wrap:hover .fav, .grid .fav.on, .grid .fav:focus-visible { opacity: 1; }
    .grid .fav.on { color: var(--accent); }
    .grid .fav:hover { background: rgba(10, 10, 16, .85); transform: none; }
    .player .bar button.on { color: var(--accent); }
    .game-badge { font-size: 10.5px; color: #8fd19e; }

    /* ---- About window ---- */
    .about { align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .about .logo-img { width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2a2440, #0d0c16 75%); box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 40px rgba(224, 184, 102, .2); }
    .about h2 { margin: 6px 0 0; font-size: 20px; }
    .about p { margin: 0; color: var(--muted); }
    .about .sphere { width: 120px; opacity: .55; margin-top: 8px; }

    /* ---- Settings ---- */
    .settings { font-size: 14px; }
    .set-scroll { flex: 1; overflow-y: auto; padding: 16px; }
    .settings section { max-width: 680px; margin: 0 auto 14px; background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; overflow: hidden; }
    .settings h3 { margin: 0; padding: 12px 16px 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8d8c99; }
    .settings .row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; }
    .settings .row + .row, .settings .chips + .row, .settings .scripts + .row, .settings .scripts:not(:empty) { border-top: 1px solid rgba(255, 255, 255, .06); }
    .settings .txt { flex: 1; min-width: 0; }
    .settings .txt b { display: block; font-weight: 600; }
    .settings .txt small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
    .settings .ctl { display: flex; align-items: center; gap: 8px; flex: none; }
    .settings .field { height: 34px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; padding: 0 10px; font: inherit;
      background: rgba(255, 255, 255, .06); color: inherit; width: 230px; max-width: 100%; }
    .settings .field::placeholder { color: rgba(236, 235, 242, .4); }
    .settings .field:focus { outline: 2px solid rgba(224, 184, 102, .25); border-color: var(--accent); }
    .settings option { background: #1c1b26; color: var(--ink); }
    .settings .field.key { width: 150px; text-align: center; font-weight: 600; }
    .settings .grow { flex: 1; width: auto; }
    .settings textarea.field { height: 34px; min-height: 34px; max-height: 200px; padding: 7px 10px; resize: vertical; font: 13px/1.4 ui-monospace, Consolas, monospace; }
    .settings textarea.field:focus { height: 120px; }
    .settings .btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .08); font: inherit; font-weight: 500; cursor: pointer; color: inherit; white-space: nowrap; }
    .settings .btn:hover { background: rgba(255, 255, 255, .14); }
    .settings .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; }
    .settings .btn.danger { color: #ff8f8a; border-color: rgba(255, 95, 87, .35); background: rgba(255, 95, 87, .10); }
    .settings .btn.danger:hover { background: rgba(255, 95, 87, .18); }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
    .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255, 255, 255, .18); transition: background .15s; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); transition: transform .15s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .settings .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding: 0 16px 14px; }
    .settings .chips button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid rgba(255, 255, 255, .08); border-radius: 8px; background: rgba(255, 255, 255, .05);
      font: inherit; font-size: 13px; cursor: pointer; text-align: left; color: inherit; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .settings .chips button:hover { background: rgba(255, 255, 255, .1); }
    .settings .chips button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .settings .chips img { width: 18px; height: 18px; flex: none; border-radius: 4px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; max-width: 250px; }
    .swatches button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2); cursor: pointer; padding: 0; }
    .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px #15151d, 0 0 0 4px var(--accent); }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .seg button { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .06); font: inherit; font-size: 13px; cursor: pointer; color: inherit; }
    .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1408; }
    .settings .scripts:empty { display: none; }
    .settings .script { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
    .settings .script + .script { border-top: 1px solid rgba(255, 255, 255, .06); }
    .settings .row-msg { padding: 0 16px 12px; font-size: 12.5px; color: var(--muted); }
    .settings .row-msg:empty { display: none; }
    .settings .row-msg.err { color: #ff8f8a; }
    @media (max-width: 560px) { .settings .row { flex-wrap: wrap; } .settings .ctl { width: 100%; } .settings .ctl .field { flex: 1; width: auto; } }
  </style>
</head>

      <button class="mb-btn" id="mb-lock" title="Lock screen"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>

    <button data-act="games">Games</button>
    <button data-act="settings">Settings…</button>
    <button data-act="chat">Chat</button>
    <button data-act="blank">Open in about:blank</button>
    <hr>
    <button data-act="account" id="mb-account">Sign in…</button>
    <button data-act="lock">Lock Screen</button>
  </div>

  <div id="desktop" aria-label="Desktop"></div>
  <div id="dock" role="toolbar" aria-label="Dock"></div>

  <div id="lock" hidden>
    <video id="lock-video" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="lock-top"><div class="lock-date" id="lock-date"></div><div class="lock-time" id="lock-time"></div></div>
    <form class="lock-card" id="lock-form" autocomplete="off">
      <img class="lock-logo logo-img" alt="">
      <div class="lock-name" id="lock-name">GhettoOS</div>
      <input class="pill" id="lock-user" placeholder="Username" autocomplete="username" spellcheck="false" aria-label="Username" maxlength="20">
      <div class="pill-wrap">
        <input class="pill" id="lock-pass" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
        <button class="pill-go" type="submit" title="Sign in"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="lock-msg" id="lock-msg" role="alert"></div>
      <div class="lock-links">
        <button type="button" id="lock-mode">Create account</button>
        <span aria-hidden="true">·</span>
        <button type="button" id="lock-guest">Continue as guest</button>
      </div>
    </form>
    <div class="lock-foot"><span class="tagline" id="tagline"></span></div>
  </div>

  <div id="cover" hidden></div>
  <datalist id="history-list"></datalist>

  <script>
    // Static build (deploy/index.html from build-static.js, or opened from file://): there is no
    // server.js. Accounts and settings stay in localStorage, Games reads the catalog straight
    // from GitHub, AI Chat calls Pollinations, and apps that need the server are hidden.
    const STATIC = !!window.GHETTO_STATIC || location.protocol === "file:";

    // ======================= Settings (stored in this browser) =======================
    const DEFAULTS = {
      // v2 + libcurl passed every site tested (Poki games, YouTube, Google, Wikipedia).
      // v1 fails Poki's game check; Epoxy hits an HTTP/2 reset on YouTube.
      engine: "v2",          // "v2" = Scramjet 2.0.67-alpha.1, "v1" = Scramjet 1.1.0
      transport: "libcurl",  // "libcurl" | "epoxy"
      wisp: "",              // empty = this server's /wisp/
      search: "brave",
      searchCustom: "",      // template with %s
      cloak: "none",         // disguise preset id (CLOAKS) or "none"
      cloakTitle: "",        // overrides the preset's title when set
      cloakIcon: "",         // overrides the preset's icon when set
      blurCloak: false,      // cover the page with another site while unfocused
      blurSite: "khan",      // CLOAKS id shown by the cover
      panicKey: "",
      panicUrl: "https://classroom.google.com",
      panicBlank: true,      // the redirect key also reopens GhettoOS in an about:blank tab
      adblock: true,         // sw.js blocks ad/tracker hosts; pop-up tabs blocked in proxied pages
      theme: "nebula",       // THEMES key (wallpaper)
      animBg: "none",        // "none" | "aurora" | "stars" | "lava"
      layout: "classic",     // "classic" | "compact" dock icons
      lockOnStart: true,     // show the lock screen when GhettoOS opens
      userName: "",          // shown in the menu bar; typed on the lock screen
    };
    const SETTINGS_REV = 2; // bump to reset saved proxy choices when the recommended defaults change
    const DESIGN_REV = 1;   // bump to reset saved wallpaper choices when the look changes
    const settings = (() => {
      try {
        const saved = JSON.parse(localStorage.getItem("proxyos-settings") || "{}");
        if (saved._rev !== SETTINGS_REV) { delete saved.engine; delete saved.transport; }
        if (saved._design !== DESIGN_REV) { delete saved.theme; delete saved.animBg; }
        return { ...DEFAULTS, ...saved, _rev: SETTINGS_REV, _design: DESIGN_REV };
      } catch { return { ...DEFAULTS, _rev: SETTINGS_REV, _design: DESIGN_REV }; }
    })();
    // Signed-in username (null = guest) and listeners for when it changes. See "Accounts".
    let account = null, syncTimer = 0;
    const onAccountChange = new Set();
    function saveSettings() {
      try { localStorage.setItem("proxyos-settings", JSON.stringify(settings)); } catch {}
      queueSync(); // signed in: also saved to the account (see "Accounts")
    }

    const SEARCH_ENGINES = {
      brave: { name: "Brave Search", url: "https://search.brave.com/search?q=%s" },
      duckduckgo: { name: "DuckDuckGo", url: "https://duckduckgo.com/?q=%s" },
      google: { name: "Google", url: "https://www.google.com/search?q=%s" },
      bing: { name: "Bing", url: "https://www.bing.com/search?q=%s" },
      startpage: { name: "Startpage", url: "https://www.startpage.com/do/search?q=%s" },
      custom: { name: "Custom…", url: null },
    };

    // ======================= Proxy engines =======================
    const ENGINES = {
      v2: { name: "Scramjet v2 (2.0.67-alpha.1) — recommended" },
      v1: { name: "Scramjet v1 (1.1.0) — fallback" },
    };
    const TRANSPORTS = { libcurl: "libcurl (recommended)", epoxy: "Epoxy" };
    const ownWisp = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/wisp/";
    const wispUrl = () => settings.wisp.trim() || ownWisp;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("failed to load " + src));
        document.head.append(s);
      });
    }

    // Register /sw.js for the chosen engine and wait until that exact worker is active.
    async function registerSW(engine) {
      const url = "/sw.js?engine=" + engine;
      const reg = await navigator.serviceWorker.register(url);
      const want = new URL(url, location.href).href;
      const isWanted = () => reg.active && reg.active.scriptURL === want;
      if (!isWanted()) {
        await new Promise((resolve) => {
          const check = () => { if (isWanted()) resolve(); };
          reg.addEventListener("updatefound", () => reg.installing?.addEventListener("statechange", check));
          navigator.serviceWorker.addEventListener("controllerchange", check);
          const t = setInterval(() => { check(); if (isWanted()) clearInterval(t); }, 200);
        });
      }
      return reg;
    }

    // Each engine returns { attach(iframe) -> { go(url), current() } }.
    async function initV1() {
      await loadScript("/baremux/index.js");
      await loadScript("/scram/scramjet.all.js");
      const PREFIX = "/go/";
      const { ScramjetController } = $scramjetLoadController();
      const scramjet = new ScramjetController({
        files: { all: "/scram/scramjet.all.js", wasm: "/scram/scramjet.wasm.wasm", sync: "/scram/scramjet.sync.js" },
        prefix: PREFIX,
      });
      scramjet.init(); // must run before the SW handles requests (it creates the config DB)
      await registerSW("v1");
      const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
      if (settings.transport === "libcurl") await connection.setTransport("/libcurl/index.mjs", [{ websocket: wispUrl() }]);
      else await connection.setTransport("/epoxy/index.mjs", [{ wisp: wispUrl() }]);
      return {
        attach(iframe) {
          return {
            go: (url) => (iframe.src = PREFIX + encodeURIComponent(url)), // scramjet.prefix + encodeURIComponent(url)
            current() {
              const p = iframe.contentWindow.location.pathname;
              return p.startsWith(PREFIX) ? decodeURIComponent(p.slice(PREFIX.length)) : null;
            },
          };
        },
      };
    }

    async function initV2() {
      await loadScript("/scramjet/scramjet.js");
      await loadScript("/controller/controller.api.js");
      const reg = await registerSW("v2");
      const { Controller } = $scramjetController;
      const { defaultConfig } = $scramjet;
      let transport;
      if (settings.transport === "libcurl") {
        const { default: LibcurlClient } = await import("/libcurl2/index.mjs"); // libcurl-transport 2.0.6
        transport = new LibcurlClient({ wisp: wispUrl() });
      } else {
        await loadScript("/epoxy3/index.js"); // epoxy-transport 3.0.1
        transport = new self.EpoxyTransport.default({ wisp: wispUrl() });
      }
      await transport.init();
      const controller = new Controller({ serviceworker: reg.active, transport, scramjetConfig: defaultConfig });
      await controller.wait();
      return {
        attach(iframe) {
          const frame = controller.createFrame(iframe);
          return {
            go: (url) => frame.go(url),
            current() {
              const p = iframe.contentWindow.location.pathname;
              const pre = new URL(frame.prefix, location.href).pathname;
              return p.startsWith(pre) ? decodeURIComponent(p.slice(pre.length)) : null;
            },
          };
        },
      };
    }

    const proxyReady = STATIC
      ? Promise.reject(new Error("The web browser needs the GhettoOS server."))
      : (settings.engine === "v2" ? initV2() : initV1()).catch((e) => {
        console.error("proxy init failed", e);
        throw e;
      });
    proxyReady.catch(() => {}); // handled where it's used

    function toUrl(input) {
      input = input.trim();
      if (/^https?:\/\//i.test(input)) return input;
      if (input.includes(".") && !input.includes(" ")) return "https://" + input;
      const tpl = settings.search === "custom" ? settings.searchCustom : SEARCH_ENGINES[settings.search]?.url;
      return (tpl && tpl.includes("%s") ? tpl : SEARCH_ENGINES.brave.url).replace("%s", encodeURIComponent(input));
    }

    // ======================= Windows =======================
    // Every window belongs to an app (its dock icon). Minimized windows are hidden (CSS) and
    // come back from the dock; the menu bar shows the focused window's app.
    const openWindows = new Set(); // { app, win }
    const MENU_H = 30;
    const dockSpace = () => (settings.layout === "compact" ? 40 : 52) + 26;
    function openWindow(title, el, opts = {}) {
      const { app = title, onclose: closed, ...rest } = opts;
      const rec = { app, win: null };
      openWindows.add(rec);
      rec.win = new WinBox(title, {
        mount: el, width: "70%", height: "70%", x: "center", y: "center", top: MENU_H, bottom: dockSpace(), ...rest,
        onfocus: () => setActiveApp(app),
        onminimize: () => { refreshDock(); setActiveApp(frontApp()); },
        onrestore: () => refreshDock(),
        onclose: () => { openWindows.delete(rec); closed?.(); refreshDock(); setActiveApp(frontApp()); },
      });
      refreshDock();
      return rec.win;
    }
    // App of the top-most visible window (WinBox raises z-index on focus).
    function frontApp() {
      let best = null, z = -1;
      for (const r of openWindows) {
        const zi = +r.win.window.style.zIndex || 0;
        if (!r.win.min && zi > z) { z = zi; best = r.app; }
      }
      return best || "Desktop";
    }
    function setActiveApp(name) { document.getElementById("mb-app").textContent = name; }

    // ======================= Browser app =======================
    // With `app` ({ name, url, icon }) the window is a site shortcut: no address bar,
    // just back / forward / reload / home, and the window keeps the app's name.
    function openBrowser(startUrl, app) {
      const el = document.createElement("div");
      el.className = app ? "app site-app" : "app";
      const svg = (d) => `<svg class="i" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
      const nav = `<button type="button" data-nav="back" title="Back">${svg("M15 18l-6-6 6-6")}</button><button type="button" data-nav="forward" title="Forward">${svg("M9 18l6-6-6-6")}</button><button type="button" data-nav="reload" title="Reload">${svg("M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5")}</button>`;
      el.innerHTML = app
        ? `<form class="bar">${nav}<button type="button" data-nav="home" title="Home">${svg("M3 11l9-8 9 8M5 10v10h14V10")}</button><span class="app-title"></span><input type="hidden"></form><iframe></iframe>`
        : `<form class="bar">${nav}<input list="history-list" placeholder="Search or enter address"><button class="go">Go</button></form><iframe></iframe>`;
      const input = el.querySelector("input");
      const iframe = el.querySelector("iframe");
      const win = openWindow(app ? app.name : "Browser", el, { app: app ? app.name : "Browser" });
      if (app) el.querySelector(".app-title").textContent = app.name;
      let tab = null;

      const ready = proxyReady.then((engine) => (tab = engine.attach(iframe)), (e) => {
        iframe.srcdoc = `<p style="font-family:sans-serif">Proxy failed to start: ${String(e.message).replace(/</g, "&lt;")}<br>Try a different engine or transport in Settings.</p>`;
        throw e;
      });

      async function go(raw) {
        const url = toUrl(raw);
        input.value = url;
        await ready;
        tab.go(url);
      }
      el.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); go(input.value); });
      if (!app) input.addEventListener("focus", fillHistoryList);

      // The proxied page is same-origin, so its history can be driven directly.
      el.querySelectorAll("[data-nav]").forEach((b) => (b.onclick = () => {
        try {
          const w = iframe.contentWindow;
          if (b.dataset.nav === "home") go(app.url);
          else if (b.dataset.nav === "back") w.history.back();
          else if (b.dataset.nav === "forward") w.history.forward();
          else w.location.reload();
        } catch {}
      }));

      // Keep the address bar and title in sync with in-page navigation.
      let retries = 0;
      iframe.addEventListener("load", () => {
        hookPanic(iframe);
        // App windows: a flaky upstream TLS connect (duck.ai does this) shows the SW's error
        // page; retry by itself up to 3 times, waiting 1 s, 2 s, then 4 s.
        try {
          if (app && retries < 3 && /^Internal Service Worker Error/.test(iframe.contentDocument.body?.innerText || "")) {
            const wait = 1000 * 2 ** retries++;
            return setTimeout(() => iframe.contentWindow.location.reload(), wait);
          }
        } catch {}
        // Block ads: proxied pages can't open pop-up / pop-under tabs.
        if (settings.adblock) try { iframe.contentWindow.open = () => null; } catch {}
        try {
          const real = tab?.current();
          if (real) {
            input.value = real;
            if (!app) win.setTitle(iframe.contentDocument.title || real);
            addHistory(real, iframe.contentDocument.title);
            runUserscripts(iframe, real);
          }
        } catch {}
      });

      if (startUrl) go(startUrl);
      else input.focus();
      return win;
    }

    // ======================= Games app =======================
    // /catalog/ merges Truffled, Seraph, Chicken King's Vault and UGS into
    // { source, name, cover, url, mirrors?, names?, launch } entries.
    let catalogPromise;
    const loadCatalog = () =>
      (catalogPromise ??= (STATIC ? staticCatalog() : fetch("/catalog/").then((r) => {
        if (!r.ok) throw new Error("catalog " + r.status);
        return r.json();
      })).catch((e) => { catalogPromise = null; throw e; }));

    // Static build: the same merge as catalog.js, done in the browser (GitHub and jsDelivr
    // allow cross-origin reads). Games that need the proxy ("proxy" launch) are left out.
    async function staticCatalog() {
      const getText = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(`${r.status} from ${url}`); return r.text(); };
      const latestSha = async (repo) => {
        try {
          const r = await fetch(`https://api.github.com/repos/${repo}/commits/main`, { headers: { accept: "application/vnd.github.sha" } });
          const sha = r.ok ? (await r.text()).trim() : "";
          if (/^[0-9a-f]{40}$/.test(sha)) return sha;
        } catch {}
        return "main";
      };
      const raw = (repo, ref, path) => `https://raw.githubusercontent.com/${repo}/${ref}/${path}`;
      const jsd = (repo, ref, path) => `https://cdn.jsdelivr.net/gh/${repo}@${ref}/${path}`;
      const decode = (s) => s.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
      const sources = {
        async truffled() {
          const repo = "skidding-code/truffled-lib", sha = await latestSha(repo);
          return JSON.parse(await getText(raw(repo, sha, "zones.json"))).flatMap((z) => {
            const url = String(z.url), base = { source: "Truffled", name: z.name, cover: z.cover, names: z.altNames };
            if (url.startsWith("http")) return []; // needs the proxy
            if (z.special?.includes("threads")) return [{ ...base, url: `https://cdn.jsdelivr.net/gh/${repo}@coi3/index.xhtml?g=${z.id}`, launch: "threads" }];
            const file = url.replace("{HTML_URL}/", "html/");
            return [{ ...base, url: jsd(repo, sha, file), mirrors: [jsd(repo, "lib", file), raw(repo, sha, file)], launch: "write" }];
          });
        },
        async seraph() {
          const repo = "a456pur/seraph", sha = await latestSha(repo);
          const site = `https://rawcdn.githack.com/${repo}/${sha}/games/`;
          const html = await getText(raw(repo, sha, "games/index.html"));
          const re = /<a[^>]*href="([^"]+)"[^>]*>\s*<div class="button"[^>]*url\('([^']+)'\)[^>]*>\s*<h2>([^<]+)<\/h2>/g;
          const seen = new Set(), out = [];
          for (const [, href, thumb, name] of html.matchAll(re)) {
            if (/^(https?:)?\/\//.test(href) || seen.has(href)) continue;
            seen.add(href);
            out.push({ source: "Seraph", name: decode(name), cover: new URL(thumb, site).href, url: new URL(href, site).href, launch: "frame" });
          }
          return out;
        },
        async chickenKingsVault() {
          const repo = "wanocapy/ChickenKingsVault", site = "https://wanocapy.github.io/ChickenKingsVault/";
          const js = await getText(raw(repo, await latestSha(repo), "games.js"));
          const re = /<a class="game-link" href="([^"]+)">\s*<img src="([^"]+)"[^>]*>\s*<div>([^<]+)<\/div>/g;
          return [...js.matchAll(re)].map(([, href, img, name]) => ({ source: "Chicken King's Vault", name: decode(name), cover: new URL(img, site).href, url: new URL(href, site).href, launch: "frame" }));
        },
        async ugs() {
          const repo = "bubbls/ugs-singlefile", sha = await latestSha(repo);
          const js = await getText(raw(repo, sha, "games.js"));
          const start = js.indexOf("["), list = js.slice(start, js.indexOf("];", start) + 1);
          const extra = new Set(["supremeduelistfix", "thiefpuzzle"]);
          return [...list.matchAll(/"((?:[^"\\]|\\.)*)"/g)].map((m) => m[1]).filter((n) => n.startsWith("cl") || extra.has(n)).map((n) => {
            const file = "UGS-Files/" + encodeURIComponent(n + ".html");
            return { source: "UGS", name: n.startsWith("cl") ? n.slice(2) : n, cover: null, url: jsd(repo, sha, file), mirrors: [raw(repo, sha, file)], launch: "write" };
          });
        },
      };
      const lists = await Promise.all(Object.entries(sources).map(([k, f]) => f().catch((e) => { console.warn(`catalog: ${k} failed: ${e.message}`); return []; })));
      const games = lists.flat();
      if (!games.length) throw new Error("couldn't load any game library");
      return games;
    }

    // Initial-letter tile for games without a cover (or whose cover fails to load).
    function letterIcon(name) {
      const d = document.createElement("div");
      d.className = "letter";
      const ch = (name.match(/[a-z0-9]/i) || ["?"])[0].toUpperCase();
      d.textContent = ch;
      let h = 0;
      for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      d.style.background = `hsl(${h % 360} 55% 45%)`;
      return d;
    }

    // Favorites and recently played games ("source|name" keys; URLs change with each catalog
    // commit). Saved locally, and to the account when signed in. "write" games that have been
    // played once also work offline: sw.js keeps their files.
    const FAV_KEY = "proxyos-favorites", PLAYED_KEY = "proxyos-played";
    const gameKey = (g) => g.source + "|" + g.name;
    const readList = (k) => { try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } };
    let favorites = new Set(readList(FAV_KEY));
    let played = readList(PLAYED_KEY);
    // Notepad notes: [{id, text, updated}] (synced to the account like favorites).
    const NOTES_KEY = "proxyos-notes";
    let notes = readList(NOTES_KEY);
    let notesRender = null; // set while a Notepad window is open
    function notesChanged() { notesRender?.(); }
    function saveNotes() {
      try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch {}
      queueSync();
    }
    function saveGameLists() {
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
        localStorage.setItem(PLAYED_KEY, JSON.stringify(played));
      } catch {}
      queueSync();
    }
    const worksOffline = (g) => g.launch === "write" && played.includes(gameKey(g));

    function openGames() {
      const el = document.createElement("div");
      el.className = "app";
      el.innerHTML = `
        <div class="picker"><div class="bar"><input type="search" placeholder="Search games"><select><option value="">All games</option><option value="@fav">★ Favorites</option><option value="@played">Played (offline-ready)</option></select></div><div class="status">Loading…</div><div class="grid"></div></div>
        <div class="player" hidden>
          <div class="bar">
            <span class="game-title"></span>
            <span class="game-msg"></span>
            <button type="button" data-act="fav" title="Favorite">&#x2606;</button>
            <button type="button" data-act="fullscreen" title="Full screen">&#x26F6;</button>
            <button type="button" data-act="download" title="Download as .html">&#x2B07;</button>
            <button type="button" data-act="close" title="Close game (back to games)">&#x2715;</button>
          </div>
        </div>`;
      const input = el.querySelector("input");
      const select = el.querySelector("select");
      const status = el.querySelector(".status");
      const grid = el.querySelector(".grid");
      const win = openWindow("Games", el);

      // ---- Player view: one game at a time inside this window ----
      const picker = el.querySelector(".picker");
      const player = el.querySelector(".player");
      const msg = el.querySelector(".game-msg");
      let current = null, frame = null, refresh = () => {};
      const favBtn = player.querySelector('[data-act="fav"]');
      const markFavBtn = () => {
        const on = !!current && favorites.has(gameKey(current));
        favBtn.classList.toggle("on", on);
        favBtn.innerHTML = on ? "&#x2605;" : "&#x2606;";
        favBtn.title = on ? "Remove from favorites" : "Add to favorites";
      };
      const toggleFav = (g) => {
        const k = gameKey(g);
        favorites.has(k) ? favorites.delete(k) : favorites.add(k);
        saveGameLists();
        refresh();
        markFavBtn();
      };
      favBtn.onclick = () => current && toggleFav(current);
      const play = (g) => {
        played = [gameKey(g), ...played.filter((k) => k !== gameKey(g))].slice(0, 200);
        saveGameLists();
        if (g.launch === "proxy") return openBrowser(g.url); // external sites go through the proxy Browser
        current = g;
        markFavBtn();
        frame = document.createElement("iframe");
        frame.allow = "autoplay; fullscreen; gamepad; cross-origin-isolated";
        player.append(frame);
        el.querySelector(".game-title").textContent = g.name;
        msg.textContent = "";
        picker.hidden = true;
        player.hidden = false;
        win.setTitle(g.name);
        launchGame(g, frame);
      };
      const closeGame = () => {
        frame?.remove(); // removing the iframe stops the game and its sound
        frame = current = null;
        refresh();
        player.hidden = true;
        picker.hidden = false;
        win.setTitle("Games");
      };
      player.querySelector('[data-act="close"]').onclick = closeGame;
      player.querySelector('[data-act="fullscreen"]').onclick = () => frame?.requestFullscreen?.().catch(() => {});
      player.querySelector('[data-act="download"]').onclick = async () => {
        if (!current) return;
        msg.textContent = "Preparing download…";
        try {
          const { offline } = await downloadGame(current);
          msg.textContent = offline ? "Downloaded." : "Downloaded (needs internet to play).";
        } catch (e) {
          msg.textContent = "Download failed: " + e.message;
        }
      };

      loadCatalog().then((games) => {
        for (const s of [...new Set(games.map((g) => g.source))]) {
          select.append(new Option(`${s} (${games.filter((g) => g.source === s).length})`, s));
        }
        const frag = document.createDocumentFragment();
        const items = games.map((g) => {
          const wrap = document.createElement("div");
          wrap.className = "tile-wrap";
          const b = document.createElement("button");
          b.className = "game";
          b.title = `${g.name} — ${g.source}`;
          if (g.cover) {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.alt = "";
            img.src = g.cover;
            img.onerror = () => img.replaceWith(letterIcon(g.name));
            b.append(img);
          } else {
            b.append(letterIcon(g.name));
          }
          const label = document.createElement("span");
          label.textContent = g.name;
          const src = document.createElement("small");
          src.textContent = g.source;
          const badge = Object.assign(document.createElement("small"), { className: "game-badge" });
          b.append(label, src, badge);
          b.onclick = () => play(g);
          const star = document.createElement("button");
          star.className = "fav";
          star.type = "button";
          star.onclick = (e) => { e.stopPropagation(); toggleFav(g); };
          wrap.append(b, star);
          frag.append(wrap);
          return { g, wrap, star, badge, hay: [g.name, ...(g.names || [])].join(" ").toLowerCase(), source: g.source };
        });
        grid.append(frag);
        const filter = (keepScroll) => {
          const q = input.value.trim().toLowerCase();
          const s = select.value;
          let n = 0;
          for (const it of items) {
            const k = gameKey(it.g), fav = favorites.has(k);
            const inList = !s || (s === "@fav" ? fav : s === "@played" ? played.includes(k) : it.source === s);
            const show = inList && (!q || it.hay.includes(q));
            it.wrap.hidden = !show;
            n += show;
            if (it.fav !== fav) { // only touch the DOM when something changed (≈5000 tiles)
              it.fav = fav;
              it.star.classList.toggle("on", fav);
              it.star.textContent = fav ? "★" : "☆";
              it.star.title = fav ? "Remove from favorites" : "Add to favorites";
            }
            const off = worksOffline(it.g);
            if (it.off !== off) { it.off = off; it.badge.textContent = off ? "✓ Works offline" : ""; }
          }
          status.textContent = s === "@fav" && !n && !q ? "No favorites yet. Hover a game and click its ☆." : `${n} games`;
          if (keepScroll !== true) grid.scrollTop = 0;
        };
        refresh = () => filter(true);
        input.addEventListener("input", filter);
        select.addEventListener("change", filter);
        filter();
        input.focus();
      }, (e) => (status.textContent = "Couldn't load catalog: " + e.message));
    }

    async function fetchFirst(urls) {
      let last;
      for (const u of urls) {
        try {
          const r = await fetch(u);
          if (r.ok) return { html: await r.text(), url: r.url || u };
          last = new Error(r.status + " " + r.statusText);
        } catch (e) { last = e; }
      }
      throw last;
    }

    // Load game `g` into `frame` (proxy games are handled by the caller).
    async function launchGame(g, frame) {
      // "frame": static game sites (Seraph via githack, Chicken King's Vault on GitHub Pages).
      // "threads": truffled games needing SharedArrayBuffer, served cross-origin-isolated by jsDelivr.
      if (g.launch === "frame" || g.launch === "threads") {
        frame.src = g.url;
        return;
      }

      // "write": CDN games – fetch the HTML and write it into a same-origin (about:blank) iframe. Not proxied.
      try {
        const { html } = await fetchFirst([g.url, ...(g.mirrors || [])]);
        const doc = frame.contentDocument;
        doc.open();
        doc.write(html);
        doc.close();
        hookPanic(frame);
      } catch (e) {
        frame.srcdoc = "Couldn't load game: " + String(e.message).replace(/</g, "&lt;");
      }
    }

    // Save game `g` as a standalone .html that runs when opened from the file manager.
    // The game's own HTML is saved with a <base> pointing at where it came from, so any
    // separate files it loads (scripts, images, sounds) still come from the CDN.
    // Single-file games then work fully offline. If the HTML can't be fetched (CORS) or the
    // game needs cross-origin isolation ("threads"), a small launcher file is saved instead.
    async function downloadGame(g) {
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      let html = null, offline = false;
      if (g.launch === "write" || g.launch === "frame") {
        try {
          const got = await fetchFirst(g.launch === "write" ? [g.url, ...(g.mirrors || [])] : [g.url]);
          html = got.html;
          const own = html.match(/<base\s[^>]*href\s*=\s*["']?([^"'\s>]+)/i);
          const base = own ? new URL(own[1], got.url).href : got.url;
          html = html.replace(/<base\s[^>]*>/gi, "");
          const tag = `<base href="${esc(base)}">`;
          const dt = html.match(/^\s*<!doctype[^>]*>/i); // keep the doctype first (else quirks mode)
          html = dt ? dt[0] + tag + html.slice(dt[0].length) : tag + html;
          // Offline if it doesn't pull in any external files (scripts, styles, images, media, frames).
          offline = !/<(script|link|img|iframe|source|audio|video|embed|object)\b[^>]*\b(src|href|data)\s*=\s*["']?(?!data:|blob:|#)[^"'\s>]/i.test(html);
        } catch { html = null; }
      }
      if (html == null) {
        html = g.launch === "threads"
          // Needs cross-origin isolation, which a local file can't provide, so jump to the real page.
          ? `<!doctype html><meta charset="utf-8"><title>${esc(g.name)}</title><script>location.replace(${JSON.stringify(g.url)})<\/script><a href="${esc(g.url)}">Play ${esc(g.name)}</a>`
          : `<!doctype html><meta charset="utf-8"><title>${esc(g.name)}</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style><iframe src="${esc(g.url)}" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>`;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = (g.name.replace(/[\\/:*?"<>|]+/g, "").trim() || "game") + ".html";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return { offline };
    }

    const coverEl = document.getElementById("cover");

    const coverSite = () => CLOAKS.find((c) => c.id === settings.blurSite) || CLOAKS.find((c) => c.id === "khan");
    function showCover() {
      const c = coverSite();

      }

    // ======================= Tab redirect (panic) key =======================
    // Jumps this tab to the redirect URL, and (optionally) first reopens GhettoOS in an
    // about:blank tab. Also hooked into same-origin iframes (proxied pages, CDN games).
    const isTyping = (t) => !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ""));
    const withScheme = (u) => (/^[a-z][a-z0-9+.-]*:/i.test(u) ? u : "https://" + u);
    function onPanicKey(e) {
      if (!settings.panicKey || e.key !== settings.panicKey || e.repeat || isTyping(e.target)) return;
      e.preventDefault();
      if (settings.panicBlank) openAboutBlank(true);
      window.top.location.href = withScheme(settings.panicUrl || DEFAULTS.panicUrl);
    }
    function hookPanic(iframe) {
      try { iframe.contentWindow.addEventListener("keydown", onPanicKey, true); } catch {}
    }
